    dataroot_lq: /data5/lxy/DASR/datasets/AIM2019_valida_div2k
    io_backend:
      type: disk

# network structures
network_g:
  type: mamba_kmeans_013_4
  img_size: 80
  patch_size: 1
  embed_dim: 60
  inner_rank: 32
  num_tokens: 64
  depths: [1,1,1,1,1,1]
  rms_norm: False
  residual_in_fp32: True
  fused_add_norm: False
  if_abs_pos_embed: False
  if_rope: False
  if_rope_residual: True
  if_cls_token: False
  upscale: 4
  upsampler: "pixelshuffledirect" 
  resi_connection: '3conv'


# path
path:
  # pretrain_network_g: /data5/lxy/DASR/experiments/camsr/models/net_g_420000.pth
  pretrain_network_g: /data5/lxy/DASR/experiments/camsr/models/net_g_470000.pth
  strict_load_g: true
  resume_state: ~


# validation settings
val:
  # val_freq: !!float 5e3
  save_img: true
  suffix: ~

  metrics:
    psnr: # metric name, can be arbitrary
      type: calculate_psnr
      crop_border: 4
      test_y_channel: true

    ssim: # metric name, can be arbitrary
      type: calculate_ssim
      crop_border: 4
      test_y_channel: true

    lpips: # metric name, can be arbitrary
      type: calculate_lpips
      crop_border: 4
      test_y_channel: true

