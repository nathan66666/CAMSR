name: CAMSR_x4_test
model_type: CAMSRModel
scale: 4
num_gpu: 1
manual_seed: 0
network_g:
  type: CAMSR
  img_size: 80
  patch_size: 1
  embed_dim: 60
  inner_rank: 32
  num_tokens: 64
  depths:
  - 1
  - 1
  - 1
  - 1
  - 1
  - 1
  upscale: 4
  upsampler: pixelshuffledirect
  resi_connection: 3conv
datasets:
  test_1:
    name: Set5
    type: PairedImageDataset
    dataroot_gt: datasets/Set5/GTmod12
    dataroot_lq: datasets/Set5/LRbicx4
    io_backend:
      type: disk
  test_2:
    name: Set14
    type: PairedImageDataset
    dataroot_gt: datasets/Set14/GTmod12
    dataroot_lq: datasets/Set14/LRbicx4
    io_backend:
      type: disk
path:
  pretrain_network_g: experiments/CAMSR_x4_train/models/net_g_latest.pth
  param_key_g: params_ema
  strict_load_g: true
val:
  save_img: true
  suffix: null
  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 4
      test_y_channel: true
    ssim:
      type: calculate_ssim
      crop_border: 4
      test_y_channel: true
