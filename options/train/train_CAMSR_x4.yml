name: CAMSR_x4_train
model_type: CAMSRModel
scale: 4
num_gpu: 1
manual_seed: 0
datasets:
  train:
    name: DF2K
    type: PairedImageDataset
    dataroot_gt: datasets/DF2K/DF2K_HR_sub
    dataroot_lq: datasets/DF2K/X4_sub
    meta_info_file: datasets/DF2K/DF2Ksub_GT.txt
    filename_tmpl: '{}'
    io_backend:
      type: disk
    gt_size: 320
    use_hflip: true
    use_rot: true
    num_worker_per_gpu: 6
    batch_size_per_gpu: 32
    dataset_enlarge_ratio: 1
    prefetch_mode: null
  val_1:
    name: Set5
    type: PairedImageDataset
    dataroot_gt: datasets/Set5/GTmod12
    dataroot_lq: datasets/Set5/LRbicx4
    io_backend:
      type: disk
  val_2:
    name: Set14
    type: PairedImageDataset
    dataroot_gt: datasets/Set14/GTmod12
    dataroot_lq: datasets/Set14/LRbicx4
    io_backend:
      type: disk
network_g:
  type: CAMSR
  img_size: 80
  patch_size: 1
  embed_dim: 60
  inner_rank: 32
  num_tokens: 64
  depths:
  - 1
  - 1
  - 1
  - 1
  - 1
  - 1
  upscale: 4
  upsampler: pixelshuffledirect
  resi_connection: 3conv
path:
  pretrain_network_g: null
  strict_load_g: true
  resume_state: null
train:
  ema_decay: 0.999
  optim_g:
    type: Adam
    lr: 0.0002
    weight_decay: 0
    betas:
    - 0.9
    - 0.99
  scheduler:
    type: MultiStepLR
    milestones:
    - 250000
    - 400000
    - 450000
    - 475000
    gamma: 0.5
  total_iter: 1000000
  warmup_iter: -1
  pixel_opt:
    type: L1Loss
    loss_weight: 1.0
    reduction: mean
val:
  val_freq: 5000.0
  save_img: false
  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 4
      test_y_channel: true
    ssim:
      type: calculate_ssim
      crop_border: 4
      test_y_channel: true
logger:
  print_freq: 100
  save_checkpoint_freq: 200.0
  use_tb_logger: true
dist_params:
  backend: nccl
  port: 29500
